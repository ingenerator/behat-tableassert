name: Run tests
on:
  push:
    branches:
      # Only mainline branches, features etc are covered on the pull_request trigger
      - '*.x'
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run tests
    strategy:
      fail-fast: false
      matrix:
        php_version:
          - '8.4'
          - '8.5'
        dependencies:
          - 'default'
        include:
          - php_version: '8.4'
            dependencies: 'lowest'
          - php_version: '8.5'
            dependencies: 'lowest'
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          tools: composer

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3
        with:
            dependency-versions: ${{ matrix.dependencies }}

      - name: Run unit tests
        run: |
          vendor/bin/phpunit
